name: HALAH local blockchain CI

on:
  push:
    branches:
      - feature/local-hardhat-integration
  workflow_dispatch:

concurrency:
  group: halah-local-blockchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-blockchain:
    name: Contract, Web3, and Streamlit integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hardhat dependencies
        run: npm install

      - name: Compile smart contracts
        run: npm run compile

      - name: Run smart-contract tests
        run: npm run test:contracts

      - name: Generate contract transaction evidence on an ephemeral chain
        run: npm run e2e:contracts

      - name: Start persistent local Hardhat JSON-RPC
        run: |
          nohup npm run node > /tmp/hardhat-node.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hardhat-node.log
          exit 1

      - name: Deploy ConsentSBT to the persistent local chain
        run: npm run deploy:local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python application modules
        run: |
          python -m py_compile \
            app.py \
            blockchain/contract.py \
            services/blockchain_service.py \
            services/consent_service.py \
            services/state_service.py \
            services/access_service.py \
            database/audit_db.py \
            database/consent_db.py

      - name: Run Python Web3 mint, access, and revoke smoke test
        run: PYTHONPATH=. python tests/blockchain_integration_smoke.py

      - name: Start Streamlit and verify its health endpoint
        run: |
          nohup streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            --server.enableCORS false \
            --server.enableXsrfProtection false \
            > /tmp/streamlit.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8501/_stcore/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Upload local blockchain and integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: halah-local-blockchain-evidence
          path: |
            blockchain/artifacts/
            blockchain/deployment/local.json
            blockchain/evidence/
            /tmp/hardhat-node.log
            /tmp/streamlit.log
          if-no-files-found: error
          retention-days: 14
